name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - name: Dependency audit (fails on high or worse)
        run: npm audit --audit-level=high
        working-directory: tools
      # The workbook, CSV files, defect pages and metrics are generated from tools/suite-data.js.
      - run: npm run build
        working-directory: tools
      - name: Generated files are up to date (the Excel file is binary, so it is skipped)
        run: git diff --exit-code -- . ':!test-suite/SauceDemo-Test-Suite.xlsx'
      - name: Every relative link in the documents works
        run: node tools/check-links.js
